#
# configs
#

# quicker responsiveness
set -s escape-time 1

# start pane index on 1
set -g base-index 1
set -g pane-base-index 1

# show status bar on top
set-option -g status-position top

# renumber windows
set-option -g renumber-windows on

# enable mouse mode
set -g mouse on

# terminal-like selection: keep highlight after drag, copy to system clipboard,
# click to clear (and leave copy mode when not scrolled back)
set -s copy-command 'wl-copy'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode MouseDown1Pane select-pane \; send -X clear-selection \; \
    if -F '#{==:#{scroll_position},0}' 'send -X cancel'

# set color mode
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# pass focus events to apps (e.g. neovim autoread)
set -g focus-events on

# larger scrollback
set -g history-limit 50000

#
# status bar
#

set -g status 'on'
set -g status-style 'fg=default,bg=default'
set -g status-left-style 'none'
set -g status-right-style 'none'
set -g status-justify 'centre'
set -g status-left-length '100'
set -g status-right-length '100'
set -g message-style 'fg=yellow,bg=default'
set -g message-command-style 'fg=yellow,bg=default'
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=green'
setw -g window-status-style 'fg=default,bg=default'
setw -g window-status-activity-style 'fg=yellow,bg=default'

# Left panel
set -g status-left '#[fg=green]「 #S 」'

# Window tab list
setw -g window-status-format '#[fg=cyan] #I #[fg=brightblack]⟫ #[fg=default]#W '
set -g window-status-separator '#[fg=brightblack]⁄'

# Window tab list active element
setw -g window-status-current-format '#[fg=green,bold] #I #[fg=brightblack,nobold]⟫ #[fg=green,bold]#W#[nobold] '

# Right panel
set -g status-right '#[fg=brightblack]  \
CPU: #[fg=green]#($HOME/dotfiles/tmux/display_cpu_usage.sh) #[fg=brightblack] | \
MEM: #[fg=green]#($HOME/dotfiles/tmux/display_mem_usage.sh)#[fg=brightblack]  | \
#[fg=green]%H:%M  '

# window/session overview
setw -g mode-style 'reverse'

#
# binds
#
# window splitting
bind i split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# window and session overview
bind C-Space choose-session -s

# create new window in current session and ask for a name
bind-key c command-prompt -p "window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# create new session and ask for a name
bind-key S command-prompt -p "session-name:" "new-session -s '%%'"

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

#reload
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf has been sourced'

